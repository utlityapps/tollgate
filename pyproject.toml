[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate"
version = "0.1.0"
description = "A checkout firewall for AI shopping agents, built on the PayPal sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tollgate = "tollgate.cli:main"
tollgate-mcp = "tollgate.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tollgate = ["static/*.html", "static/*.js", "static/*.css", "static/vendor/ag-grid/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
