# Render Blueprint: one-click deploy of Tollgate from this repo.
# https://render.com/deploy?repo=https://github.com/utlityapps/tollgate
#
# Runs with MOCK payments and the rule-based judge until you add keys. To use the real PayPal
# sandbox or the Claude judge, add PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET (and optionally
# ANTHROPIC_API_KEY) under Environment in the Render dashboard.
#
# The three secrets below are generated by Render. To log in to the dashboard, copy the value
# of TOLLGATE_ADMIN_TOKEN from the Render Environment tab and paste it into the login box.
services:
  - type: web
    name: tollgate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TOLLGATE_SIGNING_KEY
        generateValue: true
      - key: TOLLGATE_ADMIN_TOKEN
        generateValue: true
      - key: TOLLGATE_AGENT_TOKEN
        generateValue: true
      - key: TOLLGATE_DB
        value: /tmp/tollgate.db
